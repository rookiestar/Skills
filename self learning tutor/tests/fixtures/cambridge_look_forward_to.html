<head><title>look forward to - Cambridge Dictionary</title></head>

<div class="entry-body">
  <div class="hw">look forward to</div>
  <div class="pos">phrasal verb</div>

  <div class="def-block">
    <div class="def">to feel pleased and excited about something that is going to happen</div>
    <div class="trans">期待；盼望；期望</div>
    <div class="examp dexamp">
      <span class="eg dexamp">I look forward to hearing from you.</span>
      <span class="trans">我期待收到你的来信。</span>
    </div>
  </div>

  <div class="def-block">
    <div class="def">used to say that you are happy about something that will happen</div>
    <div class="trans">期盼；渴望</div>
  </div>
</div>
